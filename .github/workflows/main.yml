name: Build GCam / Camera System Module

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct Download Link for the APK file'
        required: true
        default: 'رابط_الـ_APK_هنا'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Module Directory & Download APK
        run: |
          # إنشاء الهيكل الصحيح لموديول نظام مخصص
          mkdir -p module/system/priv-app/GCamSystem
          
          # تحميل ملف الـ APK المُدخل تلقائياً
          echo "Downloading APK from provided link..."
          curl -L "${{ github.event.inputs.apk_url }}" -o module/system/priv-app/GCamSystem/GCamSystem.apk
          
          # إنشاء ملف module.prop الخاص بتعريف الموديول
          cat << EOF > module/module.prop
          id=gcam_system_module
          name=GCam System-Wide Module Port
          version=3.0
          versionCode=3
          author=Hussain
          description=Converts any camera APK into a system-wide KernelSU/Magisk module
          EOF

          # إنشاء ملف customize.sh لمنح صلاحيات النظام الصحيحة
          cat << EOF > module/customize.sh
          SKIPUNZIP=0
          ui_print "----------------------------------"
          ui_print "   Flashing Camera System Module  "
          ui_print "----------------------------------"
          set_perm_recursive \$MODPATH/system 0 0 0755 0644
          set_perm_recursive \$MODPATH/system/priv-app 0 0 0755 0755
          ui_print "Permissions applied successfully!"
          ui_print "Reboot your phone to apply changes."
          EOF
          chmod +x module/customize.sh

      - name: Create Flashable Zip
        run: |
          cd module
          zip -r ../Camera-System-Module.zip .
          cd ..
          mkdir -p output
          mv Camera-System-Module.zip output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-KernelSU-Module
          path: output/*.zip
