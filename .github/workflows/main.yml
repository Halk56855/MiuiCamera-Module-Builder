name: Build MGC GCam System Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Module & Download MGC APK
        run: |
          mkdir -p module/system/priv-app/GCamSystem
          
          echo "Downloading MGC 9.6 APK..."
          curl -L "https://1-dontsharethislink.celsoazevedo.com/file/filesc/MGC_9.6.080_V47_MGC.apk" -o module/system/priv-app/GCamSystem/GCamSystem.apk
          
          cat << EOF > module/module.prop
          id=mgc_gcam_system_module
          name=MGC 9.6 GCam System Port
          version=1.0
          versionCode=1
          author=Hussain
          description=MGC 9.6.080 packaged as a system-wide KernelSU module
          EOF

          cat << EOF > module/customize.sh
          SKIPUNZIP=0
          ui_print "----------------------------------"
          ui_print "   Flashing MGC GCam System Port  "
          ui_print "----------------------------------"
          set_perm_recursive \$MODPATH/system 0 0 0755 0644
          set_perm_recursive \$MODPATH/system/priv-app 0 0 0755 0755
          ui_print "Installation finished successfully!"
          ui_print "Reboot your phone to apply changes."
          EOF
          chmod +x module/customize.sh

      - name: Create Flashable Zip
        run: |
          cd module
          zip -r ../MGC-GCam-System-Module.zip .
          cd ..
          mkdir -p output
          mv MGC-GCam-System-Module.zip output/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MGC-GCam-KernelSU-Module
          path: output/*.zip
