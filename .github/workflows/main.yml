name: Build MiuiCamera System Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Module Structure
        run: |
          # إنشاء الهيكل الأساسي لموديول Magisk/KernelSU
          mkdir -p module/system/priv-app/MiuiCamera
          mkdir -p module/system/vendor/lib64
          
          # تحميل ملف APK الخاص بالكاميرا (يمكنك استبدال الرابط برابط حزمة MiuiCamera المتوافقة مع معالجك)
          echo "Downloading Camera APK..."
          curl -L "https://www.apkmirror.com/wp-content/themes/APKMirror/download.php?id=9519439&key=d3db59c24e22ccc545791aa159abbfd6c57a24f6" -o module/system/priv-app/MiuiCamera/MiuiCamera.apk
          
          # إنشاء ملف module.prop
          cat << EOF > module/module.prop
          id=miui_camera_system_port
          name=MiuiCamera System Port for GSI
          version=2.0
          versionCode=2
          author=Hussain
          description=MiuiCamera packaged as a system-wide KernelSU module
          EOF

          # إنشاء ملف customize.sh لمنح الصلاحيات الصحيحة لمنع خطأ الـ Archive
          cat << EOF > module/customize.sh
          SKIPUNZIP=0
          ui_print "----------------------------------"
          ui_print "   Flashing MiuiCamera System Port "
          ui_print "----------------------------------"
          set_perm_recursive \$MODPATH/system 0 0 0755 0644
          set_perm_recursive \$MODPATH/system/priv-app 0 0 0755 0755
          ui_print "Permissions applied successfully!"
          ui_print "Reboot your phone after installation."
          EOF
          chmod +x module/customize.sh

      - name: Archive to ZIP
        run: |
          cd module
          zip -r ../MiuiCamera-System-Module.zip .
          cd ..
          mkdir -p output
          mv MiuiCamera-System-Module.zip output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiuiCamera-KernelSU-Module
          path: output/*.zip
